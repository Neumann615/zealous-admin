name: ci-verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium

      # 生产改造面强卡；文档示例与历史演示页清理完成前，全仓 lint 用 pnpm lint:all 手动追踪
      - name: Lint
        run: pnpm lint

      - name: 前后端类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 前端构建
        run: pnpm build

      - name: 后端构建
        run: pnpm --dir service build

      - name: 文档同步校验
        run: pnpm docs:verify

      - name: 文档站构建
        run: pnpm docs:build

      - name: 全量 E2E
        run: pnpm test:e2e
        env:
          CI: '1'

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          retention-days: 7
