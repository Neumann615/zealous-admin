name: monitor-verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium

      # 全仓 lint/tsc 仍有历史遗留问题，CI 先只卡监控模块范围，避免新债混入
      - name: lint（监控模块范围）
        run: pnpm exec eslint e2e playwright.config.ts packages/monitor packages/monitor-sdk service/src/modules/monitor service/src/middleware src/pages/index/monitor

      - name: 后端类型检查
        run: pnpm exec tsc --noEmit -p service/tsconfig.json

      - name: 前端类型检查（含历史遗留错误，暂不卡）
        continue-on-error: true
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: 单元测试
        run: pnpm run test

      - name: E2E（渲染 + 交互 + 预警链路）
        run: pnpm run test:e2e
        env:
          CI: '1'

      - name: 上传报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          retention-days: 7